name: Update public profile metrics

on:
  workflow_dispatch:
  schedule:
    # 07:17 Riyadh time.
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-metrics.yml"

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The automatic token is scoped to this public profile repository.
    # It cannot read private Courtat repositories. No personal token is used.
    steps:
      - name: Generate contribution calendar
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: subhi229
          filename: metrics.calendar.svg
          base: ""
          template: classic
          config_timezone: Asia/Riyadh
          config_animations: "no"
          plugin_isocalendar: "yes"
          plugin_isocalendar_duration: full-year
          plugins_errors_fatal: "yes"
          retries: 2
          retries_delay: 15

      - name: Generate repository language breakdown
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: subhi229
          filename: metrics.languages.svg
          base: ""
          template: classic
          config_timezone: Asia/Riyadh
          config_animations: "no"
          repositories_affiliations: owner
          repositories_forks: "no"
          plugin_languages: "yes"
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          # Read publicly accessible language metadata only; do not clone source.
          plugin_languages_indepth: "no"
          plugins_errors_fatal: "yes"
          retries: 2
          retries_delay: 15

      - name: Check out the generated cards and latest README
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main

      - name: Verify both cards and add the README section
        shell: python
        run: |
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          for filename in ("metrics.calendar.svg", "metrics.languages.svg"):
              root = ET.parse(filename).getroot()
              if root.tag != "{http://www.w3.org/2000/svg}svg":
                  raise SystemExit(f"{filename} is not an SVG image")

          path = Path("README.md")
          text = path.read_text()
          start = "<!-- PROFILE-METRICS:START -->"
          end = "<!-- PROFILE-METRICS:END -->"
          section = "\n".join([
              start,
              "### GitHub Activity",
              "",
              "![Contribution calendar](./metrics.calendar.svg)",
              "",
              "![Repository language breakdown](./metrics.languages.svg)",
              "",
              "*Public repository languages, including AI-assisted development. Private Courtat code is excluded.*",
              end,
          ])
          if start in text or end in text:
              if text.count(start) != 1 or text.count(end) != 1 or text.index(start) >= text.index(end):
                  raise SystemExit("Malformed metrics markers; README left unchanged")
              text = re.sub(re.escape(start) + r".*?" + re.escape(end), lambda _: section, text, flags=re.S)
          else:
              text = text.rstrip() + "\n\n" + section + "\n"
          path.write_text(text)

      - name: Publish the README section
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Display generated profile metrics [skip ci]"
            git push origin HEAD:main
          fi
