<svg xmlns="http://www.w3.org/2000/svg" viewBox="35 35 620 490" style="background:#3F55E8;border-radius:20px" role="img" aria-labelledby="court-title court-desc">
  <title id="court-title">An evening of padel, beautifully organised</title>
  <desc id="court-desc">An isometric enclosed padel court with four players, a central net, glass walls and the distinctive padel service boxes.</desc>
  <defs>
    <linearGradient id="court-surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#94A5F4"/><stop offset="1" stop-color="#6479E8"/>
    </linearGradient>
    <linearGradient id="court-glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F8F9FF" stop-opacity=".2"/><stop offset="1" stop-color="#DDE5FF" stop-opacity=".07"/>
    </linearGradient>
    <linearGradient id="court-base" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F3F5FF"/><stop offset="1" stop-color="#C1C9F0"/>
    </linearGradient>
    <filter id="court-shadow" x="-.15" y="-.4" width="1.3" height="1.8"><feGaussianBlur stdDeviation="13"/></filter>
    <pattern id="racket-holes" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#20335E"/></pattern>
    <g id="padel-racket">
      <path d="M0 7v11" stroke="#142A58" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cy="-1" rx="8" ry="10" fill="#DCE782" stroke="#142A58" stroke-width="2.2"/>
      <ellipse cy="-1" rx="5.8" ry="7.8" fill="url(#racket-holes)"/>
      <path d="M-3 13h6" stroke="#F8F9FD" stroke-width="2"/>
    </g>
    <g id="player-shadow"><ellipse cx="0" cy="1" rx="15" ry="6" transform="rotate(-24)" fill="#263D8E" opacity=".18"/></g>
  </defs>
  <g id="court-model"><animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" keyTimes="0;.5;1" calcMode="spline" keySplines=".37 0 .63 1;.37 0 .63 1" dur="7s" repeatCount="indefinite"/>
    <path d="M77 287 266 181 637 387 442 504Z" fill="#182D8D" opacity=".25" filter="url(#court-shadow)"/>
    <!-- A shallow, solid plinth gives the court the feel of a miniature. -->
    <path d="M67 252 260 142 633 355 440 466Z" fill="#F8F9FD"/>
    <path d="M67 252v19l373 215v-20Z" fill="#D4DCF7"/>
    <path d="m440 466 193-111v19L440 486Z" fill="#B4C1EF"/>
    <path d="M80 250 260 150 620 355.2 440 455.2Z" fill="url(#court-surface)"/>
    <path d="M80 250 260 150 620 355.2 440 455.2Z" fill="none" stroke="#F6F8FF" stroke-width="2.7"/>
    <!-- Court plane is 10 x 20. No tennis tramlines: two service lines and their central divider. -->
    <g transform="matrix(.9 -.5 1 .57 80 250)" fill="none" stroke="#F5F7FF" stroke-width="2.2">
      <path d="M0 54H200M0 306H200M100 54V306"/>
    </g>
    <path d="M102 244 256 159" stroke="#FFFFFF" stroke-opacity=".1" stroke-width="12"/>
    <!-- Far glass walls; 3 metre panels are deliberately clear, with fine structural posts. -->
    <g fill="url(#court-glass)" stroke="#DFE7FF" stroke-opacity=".28" stroke-width="1">
      <path d="M80 250V165L260 65v85Z"/>
      <path d="M260 150V65l360 205.2v85Z"/>
    </g>
    <g stroke="#1C3265" stroke-width="3.2" stroke-linecap="round" fill="none">
      <path d="M80 250V165L260 65l360 205.2v85M140 216.7v-85M200 183.3v-85M260 150V65M320 184.2v-85M380 218.4v-85M440 252.6v-85M500 286.8v-85M560 321v-85"/>
    </g>
    <g stroke="#F8F9FF" stroke-opacity=".25" stroke-width="1.1" fill="none">
      <path d="M84 177 257 81M264 80l351 200M94 239v-50M151 208v-48M273 137v-40M392 205v-40M571 307v-40"/>
      <path d="m99 210 22-33m40 7 23-34m168-24 17 27m45 9 17 27m165 75 17 27" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <!-- Back-side players. Their feet remain on the surface; rackets have solid perforated heads. -->
    <g class="hero-player" transform="translate(291 223)">
      <use href="#player-shadow"/>
      <path d="m-4-22-4 18m11-18 7 16" stroke="#B66B4E" stroke-width="6" stroke-linecap="round"/>
      <path d="m-9-4-5 2m23-1 5 1" stroke="#F8F9FD" stroke-width="5" stroke-linecap="round"/>
      <path d="m-8-33 1 15 13-1 0-15Z" fill="#172A57"/>
      <path d="M-9-44Q0-49 8-42l2 14-18 1Z" fill="#F8F9FD"/>
      <path d="m-8-40-7 10m23-10 10 7 5-7" fill="none" stroke="#C88969" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="0" cy="-53" r="6" fill="#C88969"/><path d="M-6-54q1-8 9-5l3 5" fill="#172A3B"/>
      <use data-rally-racket="" href="#padel-racket" transform="translate(24 -48) rotate(20) scale(.75)"/>
    </g>
    <g class="hero-player" transform="translate(239 285)">
      <use href="#player-shadow"/>
      <path d="m-5-21-10 15m17-15 7 17" stroke="#D79B78" stroke-width="6" stroke-linecap="round"/>
      <path d="m-16-5-5 1m30 0 5 1" stroke="#F8F9FD" stroke-width="5" stroke-linecap="round"/>
      <path d="m-8-31-2 13 17 0-1-13Z" fill="#142A58"/>
      <path d="M-8-43Q0-47 8-40l0 13-17-1Z" fill="#DCE782"/>
      <path d="m-7-40-9 8m23-7 8 8 7 0" fill="none" stroke="#E1AB8E" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="0" cy="-51" r="6" fill="#E1AB8E"/><path d="M-6-51q-2-8 7-7l5 4" fill="#563C35"/>
      <use data-rally-racket="" href="#padel-racket" transform="translate(30 -40) rotate(50) scale(.76)"/>
    </g>
    <!-- Central net at 10 metres: a narrow woven mesh follows the isometric short axis. -->
    <g id="court-net">
      <path d="M260 352.6v-31l180-100v31Z" fill="#203864" fill-opacity=".15"/>
      <g stroke="#152C5B" stroke-opacity=".52" stroke-width=".7">
        <path d="m260 328.6 180-100m-180 107 180-100m-180 107 180-100m-180 107 180-100"/>
        <path d="M275 313.3v31M290 305v31M305 296.6v31M320 288.3v31M335 280v31M350 271.6v31M365 263.3v31M380 255v31M395 246.6v31M410 238.3v31M425 230v31"/>
      </g>
      <path d="M260 321.6 440 221.6" stroke="#F8F9FD" stroke-width="4"/>
      <path d="M260 355.6v-40m180-60v-40" stroke="#142A58" stroke-width="4.5" stroke-linecap="round"/>
      <path d="m255 358 10-5m170-95 10-5" stroke="#152A55" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g class="hero-player" transform="translate(461 321)">
      <use href="#player-shadow"/>
      <path d="m-4-22-6 18m13-18 10 14" stroke="#C88B6F" stroke-width="6" stroke-linecap="round"/>
      <path d="m-10-3-6 1m29-5 5 1" stroke="#F8F9FD" stroke-width="5" stroke-linecap="round"/>
      <path d="m-9-32 1 14 17-1-3-14Z" fill="#F8F9FD"/>
      <path d="M-8-44q9-4 16 1l1 14-18 0Z" fill="#23397A"/>
      <path d="m-7-40-9 6-8-4m32-2 7 11" fill="none" stroke="#D99D7C" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="0" cy="-52" r="6" fill="#D99D7C"/><path d="M-6-52q-1-9 8-7l4 5" fill="#273143"/>
      <use data-rally-racket="" href="#padel-racket" transform="translate(-30 -46) rotate(-25) scale(.8)"/>
    </g>
    <g class="hero-player" transform="translate(410 382)">
      <use href="#player-shadow"/>
      <path d="m-4-22-11 16m18-16 8 18" stroke="#955C46" stroke-width="6" stroke-linecap="round"/>
      <path d="m-15-5-6 1m33 1 6 1" stroke="#F8F9FD" stroke-width="5" stroke-linecap="round"/>
      <path d="m-9-32-1 15h18l-1-16Z" fill="#172A57"/>
      <path d="M-8-44q9-5 16 1l2 15-20 0Z" fill="#DCE782"/>
      <path d="m-8-40-9 6-8-8m33 2 6 12" fill="none" stroke="#AC775B" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="0" cy="-53" r="6" fill="#AC775B"/><path d="M-6-53q-1-8 8-7l4 6" fill="#203041"/>
      <use data-rally-racket="" href="#padel-racket" transform="translate(-30 -50) rotate(-30) scale(.8)"/>
    </g>
    <!-- Near walls stay light and transparent so the players and court markings read clearly. -->
    <g fill="url(#court-glass)" stroke="#DFE7FF" stroke-opacity=".28" stroke-width="1">
      <path d="M80 250V165l360 205.2v85Z"/>
      <path d="M440 455.2v-85l180-100v85Z"/>
    </g>
    <g stroke="#183063" stroke-width="3.2" stroke-linecap="round" fill="none">
      <path d="M80 165 440 370.2l180-100M80 250v-85M140 284.2v-85M200 318.4v-85M320 386.8v-85M380 421v-85M440 455.2v-85M500 421.9v-85M560 388.5v-85M620 355.2v-85"/>
      <path d="M80 250 440 455.2l180-100" stroke-width="2.2"/>
    </g>
    <path d="m87 177 348 199 178-98" stroke="#F8F9FF" stroke-opacity=".42" stroke-width="1.1" fill="none"/>
    <path d="m118 227 12 20m288 128 12 20m46 13 22-34m35 1 22-34" stroke="#F8F9FF" stroke-opacity=".24" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle id="rally-impact" r="6" fill="none" stroke="#F5FFD1" stroke-width="1.5" opacity="0"/>
    <circle cx="315.25651510749424" cy="174.29523053441056" r="6" fill="none" stroke="#F5FFD1" stroke-width="1.5" opacity="0"><animate attributeName="r" values="6;17;17" keyTimes="0;0.07237;1" dur="3.04s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values=".65;0;0" keyTimes="0;0.07237;1" dur="3.04s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="430.66190539060744" cy="274.2749537703707" r="6" fill="none" stroke="#F5FFD1" stroke-width="1.5" opacity="0"><animate attributeName="r" values="6;17;17" keyTimes="0;0.07237;1" dur="3.04s" begin="0.76s" repeatCount="indefinite"/><animate attributeName="opacity" values=".65;0;0" keyTimes="0;0.07237;1" dur="3.04s" begin="0.76s" repeatCount="indefinite"/></circle><circle cx="269.5821937767704" cy="244.51148141663822" r="6" fill="none" stroke="#F5FFD1" stroke-width="1.5" opacity="0"><animate attributeName="r" values="6;17;17" keyTimes="0;0.07237;1" dur="3.04s" begin="1.52s" repeatCount="indefinite"/><animate attributeName="opacity" values=".65;0;0" keyTimes="0;0.07237;1" dur="3.04s" begin="1.52s" repeatCount="indefinite"/></circle><circle cx="379.6" cy="331.30717967697245" r="6" fill="none" stroke="#F5FFD1" stroke-width="1.5" opacity="0"><animate attributeName="r" values="6;17;17" keyTimes="0;0.07237;1" dur="3.04s" begin="2.2800000000000002s" repeatCount="indefinite"/><animate attributeName="opacity" values=".65;0;0" keyTimes="0;0.07237;1" dur="3.04s" begin="2.2800000000000002s" repeatCount="indefinite"/></circle><g id="rally-ball" transform="translate(315.25651510749424 174.29523053441056)"><animateTransform attributeName="transform" type="translate" values="315.257 174.295;430.662 274.275;269.582 244.511;379.600 331.307;315.257 174.295" dur="3.04s" repeatCount="indefinite" calcMode="linear"/>
      <ellipse cy="21" rx="7" ry="3" fill="#172F75" opacity=".14"/>
      <circle r="6.5" fill="#E5EF90"/>
      <path d="M-5-4Q2-2 2 6M3-5Q-2-3-5 2" fill="none" stroke="#FCFFD7" stroke-width="1.25"/>
    </g>
  </g>
</svg>